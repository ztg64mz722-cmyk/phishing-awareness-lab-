    <title>تنبيه أمني - توعية ضد التصيّد</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f6f9; text-align: center; padding: 50px; }
        .box { background: white; padding: 30px; border-radius: 8px; max-width: 400px; margin: auto; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2 { color: #d9534f; }
        p { color: #333; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="box">
        <h2>⚠️ تنبيه توعوي أمني</h2>
        <p>هذه صفحة تجريبية لمشروع توعوي في الأمن السيبراني للتنبيه بمخاطر التصيّد الإلكتروني (Phishing).</p>
        <p>لو كانت هذه الصفحة تابعة لجهة خبيثة لتم استغلال بياناتك. احرص دائماً على التحقق من روابط مواقع التواصل الاجتماعي قبل إدخال أي معلومات.</p>
    </div>
